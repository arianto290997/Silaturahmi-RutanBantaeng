<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silaturahmi Terpadu — UPT Rutan Bantaeng</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        html, body { height: 100%; background: #f0f4f8; }

        /* --- LAYAR AWAL --- */
        #layarAwal {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; padding: 20px; text-align: center;
        }
        .judul { font-size: 22px; font-weight: bold; color: #1d3557; margin-bottom: 10px; }
        .ruang-info { font-size: 15px; color: #555; margin-bottom: 40px; }
        .kotak-timer { font-size: 36px; font-weight: bold; color: #999; margin-bottom: 40px; }
        .tombol-mulai {
            background: #2a9d8f; color: white; border: none; padding: 18px 40px;
            font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer;
        }
        .tombol-mulai:active { background: #218c7b; }
        .catatan { margin-top: 20px; font-size: 13px; color: #777; line-height: 1.6; }

        /* --- LAYAR PANGGILAN --- */
        #layarPanggilan { display: none; height: 100%; position: relative; }
        
        .bar-atas {
            position: absolute; top: 0; left: 0; right: 0; z-index: 20;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
            padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .bar-atas .nama-ruang { color: white; font-size: 14px; font-weight: bold; }
        .bar-atas .timer { 
            color: white; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.3);
            padding: 4px 12px; border-radius: 20px; min-width: 90px; text-align: center;
        }
        .timer.habis { background: #e63946; }

        .tombol-tukar {
            position: absolute; top: 60px; right: 15px; z-index: 20;
            background: rgba(255,255,255,0.9); border: none; padding: 8px 12px;
            border-radius: 20px; font-size: 13px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* --- AREA VIDEO --- */
        .video-besar {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #1a1a1a;
        }
        .video-kecil {
            position: absolute; bottom: 20px; right: 15px; width: 140px; height: 100px;
            background: #333; border-radius: 8px; border: 2px solid white; z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); overflow: hidden;
        }
        .label-nama {
            position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6);
            color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; z-index: 5;
        }

        /* --- TOMBOL KONTROL --- */
        .kontrol-bawah {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
            display: flex; justify-content: center; gap: 15px; padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
        }
        .btn-kontrol {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.2); color: white; font-size: 20px; cursor: pointer;
        }
        .btn-tutup { background: #e63946; }

        /* --- Jitsi container --- */
        .jitsi-box { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- LAYAR AWAL -->
    <div id="layarAwal">
        <div class="judul">📢 Silaturahmi Terpadu</div>
        <div class="ruang-info" id="infoRuang">Memuat...</div>
        <div class="kotak-timer" id="tampilTimer">⏳ Menunggu dimulai</div>
        <button class="tombol-mulai" id="tombolMulai" onclick="mulaiPanggilan()">
            📞 MULAI PANGGILAN VIDEO
        </button>
        <div class="catatan">
            ✅ Tidak perlu instal aplikasi apa pun<br>
            ⚠️ Tekan tombol hanya setelah siap berbicara — waktu akan mulai
        </div>
    </div>

    <!-- LAYAR PANGGILAN -->
    <div id="layarPanggilan">
        <div class="bar-atas">
            <span class="nama-ruang" id="namaRuang">-</span>
            <span class="timer" id="timerPanggilan">15:00</span>
        </div>

        <button class="tombol-tukar" onclick="tukarTampilan()">🔄 Tukar Tampilan</button>

        <!-- Video Besar -->
        <div class="video-besar" id="kotakBesar">
            <span class="label-nama" id="labelBesar">-</span>
            <div id="wadahBesar"></div>
        </div>

        <!-- Video Kecil -->
        <div class="video-kecil" id="kotakKecil">
            <span class="label-nama" id="labelKecil">-</span>
            <div id="wadahKecil"></div>
        </div>

        <!-- Kontrol Bawah -->
        <div class="kontrol-bawah">
            <button class="btn-kontrol" id="btnMikrofon" title="Mikrofon">🎤</button>
            <button class="btn-kontrol" id="btnKamera" title="Kamera">📷</button>
            <button class="btn-kontrol btn-tutup" onclick="tutupPanggilan()" title="Akhiri">📞</button>
        </div>
    </div>

    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        // === PENGATURAN ===
        const DURASI_MENIT = 15;
        let sisaDetik = DURASI_MENIT * 60;
        let waktuBerjalan = false;
        let panggilanBesar = null;
        let panggilanKecil = null;
        let susunanBesar = 'lawan'; // 'lawan' atau 'saya'
        
        // Ambil data dari alamat
        const urlParams = new URLSearchParams(window.location.search);
        const kodeRuang = urlParams.get('ruang') || 'ruang-umum';
        const namaSaya = urlParams.get('nama') || 'Peserta';
        const namaLawan = namaSaya.includes('Warga') ? 'Keluarga' : 'Warga Binaan';

        // Tampilkan info ruang
        document.getElementById('infoRuang').textContent = `Ruang: ${kodeRuang}`;
        document.getElementById('namaRuang').textContent = `Ruang: ${kodeRuang}`;

        // === MULAI PANGGILAN ===
        function mulaiPanggilan() {
            if (waktuBerjalan) return;
            waktuBerjalan = true;

            // Ganti layar
            document.getElementById('layarAwal').style.display = 'none';
            document.getElementById('layarPanggilan').style.display = 'block';

            // Mulai timer
            hitungMundur();

            // Muat video awal
            muatVideo();
        }

        // === TUKAR TAMPILAN ===
        function tukarTampilan() {
            susunanBesar = susunanBesar === 'lawan' ? 'saya' : 'lawan';
            muatVideo();
        }

        // === MUAT VIDEO KE KOTAK ===
        function muatVideo() {
            // Bersihkan dulu
            document.getElementById('wadahBesar').innerHTML = '';
            document.getElementById('wadahKecil').innerHTML = '';

            const namaDiBesar = susunanBesar === 'lawan' ? namaLawan : namaSaya;
            const namaDiKecil = susunanBesar === 'lawan' ? namaSaya : namaLawan;

            document.getElementById('labelBesar').textContent = namaDiBesar;
            document.getElementById('labelKecil').textContent = namaDiKecil;

            // Muat ke kotak besar
            buatJitsi('wadahBesar', namaDiBesar);
            // Muat ke kotak kecil
            buatJitsi('wadahKecil', namaDiKecil);
        }

        // === BUAT INSTAN JITSI ===
        function buatJitsi(wadahId, namaPengguna) {
            const wadah = document.getElementById(wadahId);
            
            const ops = {
                roomName: kodeRuang,
                width: '100%',
                height: '100%',
                parentNode: wadah,
                interfaceConfigOverwrite: {
                    DEFAULT_BACKGROUND: '#1a1a1a',
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false,
                    TOOLBAR_BUTTONS: [] // Sembunyikan toolbar bawaan Jitsi
                },
                userInfo: { displayName: namaPengguna },
                configOverwrite: {
                    disableDeepLinking: true,
                    prejoinPageEnabled: false, // Langsung masuk tanpa layar tunggu
                    startWithAudioMuted: false,
                    startWithVideoMuted: false
                }
            };

            return new JitsiMeetExternalAPI('meet.jit.si', ops);
        }

        // === HITUNG MUNDUR ===
        function hitungMundur() {
            const elemenTimer = document.getElementById('timerPanggilan');
            
            setInterval(() => {
                if (sisaDetik < 0) return;

                let m = Math.floor(sisaDetik / 60);
                let d = sisaDetik % 60;
                elemenTimer.textContent = `${m.toString().padStart(2,'0')}:${d.toString().padStart(2,'0')}`;

                if (sisaDetik === 180) {
                    elemenTimer.classList.add('habis');
                    alert('⚠️ Sisa 3 menit lagi!');
                }
                if (sisaDetik === 0) {
                    alert('⏰ Waktu habis — terima kasih sudah berkunjung!');
                    tutupPanggilan();
                }
                sisaDetik--;
            }, 1000);
        }

        // === TUTUP PANGGILAN ===
        function tutupPanggilan() {
            if (panggilanBesar) panggilanBesar.dispose();
            if (panggilanKecil) panggilanKecil.dispose();
            window.location.reload();
        }
    </script>
</body>
</html>
