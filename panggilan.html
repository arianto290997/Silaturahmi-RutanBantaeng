<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panggilan Video — Silaturahmi Terpadu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f4f8; padding: 20px; }
        .header { background: #1d3557; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .timer { font-size: 32px; font-weight: bold; text-align: center; padding: 15px; background: white; border-radius: 8px; margin-bottom: 20px; color: #666; }
        .timer.aktif { color: #2a9d8f; }
        .timer.habis { color: #e63946; }
        .konten { max-width: 900px; margin: 0 auto; }
        .tombol-gabung { display: block; width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background: #2a9d8f; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
        .tombol-gabung:hover { background: #218c7b; }
        .info { text-align: center; color: #555; margin-bottom: 15px; }
        .jitsi-container { width: 100%; height: 500px; border-radius: 8px; overflow: hidden; background: #ddd; display: none; }
    </style>
</head>
<body>
    <div class="konten">
        <div class="header">
            <h2>📢 Silaturahmi Terpadu — UPT Rutan Kelas IIB Bantaeng</h2>
            <p id="infoRuang">Terhubung di ruang: —</p>
        </div>

        <div class="timer" id="timer">
            ⏳ Menunggu bergabung...
        </div>

        <button class="tombol-gabung" id="tombolGabung" onclick="mulaiPanggilan()">
            📞 KLIK DI SINI UNTUK BERGABUNG PANGGILAN
        </button>

        <p class="info">⚠️ Tekan tombol di atas HANYA setelah siap berbicara — waktu akan mulai dihitung!</p>

        <div class="jitsi-container" id="wadahVideo"></div>
    </div>

    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        // === PENGATURAN ===
        const DURASI_MENIT = 15;
        let sisaDetik = DURASI_MENIT * 60;
        let waktuBerjalan = false;
        let antarmukaJitsi = null;
        let intervalHitung = null;

        // Ambil data dari alamat
        const urlParams = new URLSearchParams(window.location.search);
        const kodeRuang = urlParams.get('ruang') || 'ruang-umum';
        const namaPengguna = urlParams.get('nama') || 'Peserta';
        
        // Tampilkan nama ruang
        document.getElementById('infoRuang').textContent = 
            `Terhubung di ruang: ${kodeRuang} — ${namaPengguna}`;

        // === TIMER MULAI HANYA SAAT TOMBOL DIKLIK ===
        function mulaiPanggilan() {
            if (waktuBerjalan) return;
            waktuBerjalan = true;

            // Sembunyikan tombol
            document.getElementById('tombolGabung').style.display = 'none';
            document.querySelector('.info').style.display = 'none';

            // Ubah tampilan timer jadi angka & mulai hitung
            const elemenTimer = document.getElementById('timer');
            elemenTimer.classList.add('aktif');
            hitungMundur();

            // Tampilkan panggilan video
            const wadah = document.getElementById('wadahVideo');
            wadah.style.display = 'block';

            const pilihan = {
                roomName: kodeRuang,
                width: '100%',
                height: 500,
                parentNode: wadah,
                interfaceConfigOverwrite: {
                    DEFAULT_BACKGROUND: '#f0f4f8',
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false
                },
                userInfo: { displayName: namaPengguna }
            };

            antarmukaJitsi = new JitsiMeetExternalAPI('meet.jit.si', pilihan);
        }

        // Fungsi hitung mundur
        function hitungMundur() {
            const elemenTimer = document.getElementById('timer');
            
            intervalHitung = setInterval(() => {
                let menit = Math.floor(sisaDetik / 60);
                let detik = sisaDetik % 60;

                elemenTimer.textContent = 
                    `${menit.toString().padStart(2, '0')}:${detik.toString().padStart(2, '0')}`;

                // Peringatan sisa 3 menit
                if (sisaDetik === 180) {
                    elemenTimer.classList.add('habis');
                    alert('⚠️ Sisa waktu tinggal 3 menit lagi!');
                }

                sisaDetik--;

                if (sisaDetik < 0) {
                    clearInterval(intervalHitung);
                    alert('⏰ Waktu habis — panggilan akan ditutup. Terima kasih!');
                    if (antarmukaJitsi) antarmukaJitsi.hangup();
                }
            }, 1000);
        }
    </script>
</body>
</html>
